<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f8672" />
      <stop offset="100%" stop-color="#0a463b" />
    </linearGradient>
  </defs>
  <!-- Squircle de Marca -->
  <rect width="32" height="32" rx="7.5" fill="url(#brandGrad)" />
  <!-- Borde de alto contraste para pestañas oscuras / claras -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Emblema Financiero (Landmark / Institución de Crédito) -->
  <g fill="#ffffff">
    <!-- Techo / Frontón triangular simétrico -->
    <path d="M16 6 L7 11.5 H25 Z" />
    <!-- Entablamento superior -->
    <rect x="7.5" y="12.2" width="17" height="1.6" rx="0.5" />
    <!-- 4 Columnas con espaciado idéntico -->
    <rect x="9" y="14.6" width="2.2" height="6.6" rx="0.6" />
    <rect x="13" y="14.6" width="2.2" height="6.6" rx="0.6" />
    <rect x="17" y="14.6" width="2.2" height="6.6" rx="0.6" />
    <rect x="21" y="14.6" width="2.2" height="6.6" rx="0.6" />
    <!-- Base / Estilóbato escalonado -->
    <rect x="7" y="22" width="18" height="1.6" rx="0.5" />
    <rect x="5.5" y="24.2" width="21" height="1.8" rx="0.6" />
  </g>
</svg>